<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ConCAD revision history table (Edit > Revision History, first sheet).
  Units: mm.  The group marked data-repeat="revisions" is one table row,
  repeated once per version (newest five, oldest at the top); the table
  grows upwards from where it is placed.  The change description wraps at
  data-wrap-width, its row then grows and the row's lines marked
  data-stretch="row" lengthen.  The frame (data-stretch="rows") grows with
  the rows.  Row tokens: Rev1, Rev1Date, Rev1Desc, Rev1By (in braces).
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
   width="103.139mm" height="14.049mm" viewBox="0 0 103.139 14.049">
  <rect data-stretch="rows" x="0.125" y="0.125" width="102.889" height="13.799" stroke="#000000" stroke-width="0.25" fill="none" />
  <text x="0.741" y="3.624" font-family="Arial" font-size="3.52778" font-weight="bold">REVISION HISTORY</text>
  <line x1="0.125" y1="5.024" x2="103.014" y2="5.024" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="10.552" y1="5.024" x2="10.552" y2="9.324" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="32.478" y1="5.024" x2="32.478" y2="9.324" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="81.255" y1="5.024" x2="81.255" y2="9.324" stroke="#000000" stroke-width="0.25" fill="none" />
  <text x="1.263" y="8.084" font-family="Arial" font-size="2.11667">Rev.</text>
  <text x="11.23" y="8.084" font-family="Arial" font-size="2.11667">Issue date</text>
  <text x="33.247" y="8.084" font-family="Arial" font-size="2.11667">Change description</text>
  <text x="81.964" y="8.084" font-family="Arial" font-size="2.11667">Revised by</text>
  <g data-repeat="revisions" data-row-height="4.6" data-max-rows="5">
    <line x1="0.125" y1="9.324" x2="103.014" y2="9.324" stroke="#000000" stroke-width="0.25" fill="none" />
    <line data-stretch="row" x1="10.552" y1="9.324" x2="10.552" y2="13.924" stroke="#000000" stroke-width="0.25" fill="none" />
    <line data-stretch="row" x1="32.478" y1="9.324" x2="32.478" y2="13.924" stroke="#000000" stroke-width="0.25" fill="none" />
    <line data-stretch="row" x1="81.255" y1="9.324" x2="81.255" y2="13.924" stroke="#000000" stroke-width="0.25" fill="none" />
    <text x="1.351" y="12.724" font-family="Arial" font-size="2.82222">{Rev1}</text>
    <text x="11.348" y="12.724" font-family="Arial" font-size="2.82222">{Rev1Date}</text>
    <text data-wrap-width="47.2" x="33.274" y="12.724" font-family="Arial" font-size="2.82222">{Rev1Desc}</text>
    <text x="82.052" y="12.724" font-family="Arial" font-size="2.82222">{Rev1By}</text>
  </g>
</svg>
