<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ConCAD title block: vehicle details + design details panels.  Units: mm.
  Filled from Design Details; Project_prefix, Project_number, Customer,
  Vehicle_Manufacturer, Vehicle_Model, QTY, Vehicle_Length and No_of_Doors
  are design variables (set them on the Design tab), RevisedBy is the
  reviser of the latest version (File > Create Version).
  Both panels share one row grid (header 5.007, rows 7.662).
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
   width="143.229mm" height="58.894mm" viewBox="0 0 143.229 58.894">

  <!-- Vehicle details (left), bottom-aligned with the design rows -->
  <rect x="0.125" y="15.45" width="68.979" height="43.319" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="0.125" y1="20.457" x2="69.104" y2="20.457" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="0.125" y1="28.119" x2="69.104" y2="28.119" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="0.125" y1="35.782" x2="69.104" y2="35.782" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="0.125" y1="43.444" x2="69.104" y2="43.444" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="0.125" y1="51.107" x2="69.104" y2="51.107" stroke="#000000" stroke-width="0.25" fill="none" />
  <text x="1.537" y="18.957" font-family="Arial" font-size="3.52778" font-weight="bold">VEHICLE DETAILS</text>
  <text x="1.714" y="23.219" font-family="Arial" font-size="2.11667">Manufacturer</text>
  <text x="1.714" y="26.62" font-family="Arial" font-size="3.52778">{Vehicle_Manufacturer}</text>
  <text x="1.714" y="30.881" font-family="Arial" font-size="2.11667">Model</text>
  <text x="1.714" y="34.282" font-family="Arial" font-size="3.52778">{Vehicle_Model}</text>
  <text x="1.714" y="38.544" font-family="Arial" font-size="2.11667">Quantity</text>
  <text x="1.714" y="41.945" font-family="Arial" font-size="3.52778">{QTY}</text>
  <text x="1.714" y="46.206" font-family="Arial" font-size="2.11667">Length</text>
  <text x="1.714" y="49.608" font-family="Arial" font-size="3.52778">{Vehicle_Length}</text>
  <text x="1.714" y="54.289" font-family="Arial" font-size="2.11667">Number of doors</text>
  <text x="1.714" y="57.27" font-family="Arial" font-size="3.52778">{No_of_Doors}</text>

  <!-- Design details (right) -->
  <rect x="74.125" y="0.125" width="68.979" height="58.644" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="5.132" x2="143.104" y2="5.132" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="12.794" x2="143.104" y2="12.794" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="20.457" x2="143.104" y2="20.457" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="28.119" x2="143.104" y2="28.119" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="35.782" x2="143.104" y2="35.782" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="43.444" x2="143.104" y2="43.444" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="74.125" y1="51.107" x2="143.104" y2="51.107" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="96.957" y1="51.107" x2="96.957" y2="58.769" stroke="#000000" stroke-width="0.25" fill="none" />
  <line x1="119.689" y1="51.107" x2="119.689" y2="58.769" stroke="#000000" stroke-width="0.25" fill="none" />
  <text x="75.537" y="3.632" font-family="Arial" font-size="3.52778" font-weight="bold">DESIGN DETAILS</text>
  <text x="75.714" y="7.894" font-family="Arial" font-size="2.11667">Drawing number / title</text>
  <text x="75.714" y="11.295" font-family="Arial" font-size="3.52778">{Project_prefix}_{Project_number} — {Title}</text>
  <text x="75.714" y="15.556" font-family="Arial" font-size="2.11667">Customer</text>
  <text x="75.714" y="18.957" font-family="Arial" font-size="3.52778">{Customer}</text>
  <text x="75.714" y="23.219" font-family="Arial" font-size="2.11667">Description</text>
  <text x="75.714" y="26.62" font-family="Arial" font-size="3.52778">{Description}</text>
  <text x="75.714" y="30.881" font-family="Arial" font-size="2.11667">Company</text>
  <text x="75.714" y="34.282" font-family="Arial" font-size="3.52778">{Organisation}</text>
  <text x="75.714" y="38.544" font-family="Arial" font-size="2.11667">Original author</text>
  <text x="75.714" y="41.945" font-family="Arial" font-size="3.52778">{Author}</text>
  <text x="75.714" y="46.206" font-family="Arial" font-size="2.11667">Revised by</text>
  <text x="75.714" y="49.608" font-family="Arial" font-size="3.52778">{RevisedBy}</text>
  <text x="75.714" y="54.289" font-family="Arial" font-size="2.11667">Current revision</text>
  <text x="75.714" y="57.27" font-family="Arial" font-size="3.52778">{Revision}</text>
  <text x="98.757" y="54.289" font-family="Arial" font-size="2.11667">Revision issue date</text>
  <text x="98.757" y="57.27" font-family="Arial" font-size="3.52778">{Date}</text>
  <text x="121.489" y="54.289" font-family="Arial" font-size="2.11667">Sheet</text>
  <text x="121.489" y="57.27" font-family="Arial" font-size="3.52778">{Sheets}</text>
</svg>
